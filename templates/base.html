<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Inventario{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
{% include "components/navbar.html" %}
<header class="hero py-5">
    <div class="container">
        <h1 class="display-6 fw-bold">{% block header %}Sistema de Inventario{% endblock %}</h1>
        <p class="lead mb-0">{% block subtitle %}Proyecto Integrador - Desarrollo de Aplicaciones Web{% endblock %}</p>
    </div>
</header>
<main class="container py-5">
    {% block content %}{% endblock %}
</main>
{% include "components/footer.html" %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
